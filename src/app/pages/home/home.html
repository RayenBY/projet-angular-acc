<div class="page">
  <app-user-profile />
  <app-friends-list />
  <app-notifications />

  <section class="card-section teal">
    <div class="card-icon"><i class="bi bi-calendar-event-fill"></i></div>
    <div class="card-body">
      <h2>Liste des conférences à venir</h2>
      <p class="subtitle">Cliquez sur le titre d'une conférence pour afficher ses détails.</p>

      <input type="text" name="search" class="search" placeholder="Taper le titre de la conférence"
        [(ngModel)]="searchTitle" />

      <app-list-conf [conferences]="upcomingConferences()" (register)="register($event)" />
    </div>
  </section>
</div>
